name: tools

# On GitHub's hosted runners only. This never builds, pulls, or runs an image: it reads the
# registry, and promote copies within it. check: every pull request, the changed tools' rules,
# an unpublished version, a public amd64 candidate, and a record of that candidate's passing
# test. promote: a push to main that changes a tool, copying the candidate the merge commit's
# source names to its version tag.

on:
  pull_request:
  push:
    branches: [main]
    paths: ["tools/**"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -I -m unittest discover tests
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF"
          tools=$(scripts/changed-tools "origin/$BASE_REF...HEAD")
          [[ -n "$tools" ]] || { echo "no tool changed"; exit 0; }
          dirs=(); for t in $tools; do dirs+=("tools/$t"); done
          python3 -I scripts/check.py "${dirs[@]}" --registry "$REGISTRY/${GITHUB_REPOSITORY,,}"

  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y skopeo
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - env:
          BEFORE: ${{ github.event.before }}
        run: |
          tools=$(scripts/changed-tools "$BEFORE" "$GITHUB_SHA")
          [[ -n "$tools" ]] || { echo "no tool to promote"; exit 0; }
          for t in $tools; do
            VERSION=$(python3 -I -c "import sys; sys.path.insert(0, 'scripts'); import check, pathlib; print(check.frontmatter(pathlib.Path('tools/$t/SKILL.md'))['metadata']['version'])")
            TAG=$(python3 -I scripts/check.py --candidate "tools/$t" --registry "$REGISTRY/${GITHUB_REPOSITORY,,}")
            TESTED=$(python3 -I -c "import sys; sys.path.insert(0, 'scripts'); import check, pathlib; print(check.frontmatter(pathlib.Path('results/$t/$VERSION.txt'))['digest'])")
            scripts/promote "${TAG%:*}" "${TAG##*:}" "$TESTED" "$VERSION" | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
